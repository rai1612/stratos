services:
  db:
    image: postgres:16
    container_name: stratos-db
    environment:
      POSTGRES_DB: stratos_db
      POSTGRES_USER: stratos_user
      POSTGRES_PASSWORD: stratos_password
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
